test.prop = prop for env1

#Provide base URL of application under test
env.baseurl=

#set appropriate teststep provider package
step.provider.pkg=

#you can override this property from config file by providing "browser" parameter

driver.name=appiumDriver

#[Appium - Local] 
#remote.server=127.0.0.1
#remote.port=4723
#appium.additional.capabilities= {'browser_name':'','deviceName':'b1b8bc0b','platformName':'Android','automationName':'UiAutomator2','driverClass':'io.appium.java_client.android.AndroidDriver','newCommandTimeout':'180'}

#[Appium - Perfecto]
perfecto.cloud=continental-public
remote.server=https://${perfecto.cloud}.perfectomobile.com/nexperience/perfectomobile/wd/hub
remote.port=80
appium.capabilities.app=PUBLIC:app-uat.apk

#Connect to Perfecto mobile using session id(Preferred)
appium.additional.capabilities= {'deviceSessionId':'deviceSessionId','securityToken':'securityToken','autoLaunch':false,'automationName'='Appium','platformName':'Android','driverClass':'io.appium.java_client.android.AndroidDriver'}

#Connect to Perfecto mobile using Device Name
#appium.additional.capabilities= {'deviceName':'deviceName','securityToken':'securityToken','autoLaunch':false,'automationName'='Appium','platformName':'Android','driverClass':'io.appium.java_client.android.AndroidDriver'}

#application name is must for execution. i.e. bundleId
aut.appName=com.google.android.calculator

#Set this property to true and provide the updated apk path if you need to update app before launching
aut.updateApp=false
aut.path=resources/apps/apkName.apk

#Set this property to true if you want to clear app cache before launching
aut.clearCache=false

#andriod specific timeouts. Check online for more details
android.apk.keyInjectionDelay=100
android.apk.waitForIdleTimeout=2000
android.apk.waitForSelectorTimeout=1000

