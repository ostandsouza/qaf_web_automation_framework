##################################################################
# appication.properties 
# this file should be located under ./resources directory
# if not then you need to specify file by system property "application.properties.file"
#
##################################################################
selenium.wait.timeout=5000

#Provide base URL of application under test
env.baseurl=https://dev2.contiplus.net/#/auth/login

env.resources=resources
resources.load.subdirs=0

#set appropriate teststep provider package
step.provider.pkg=

#[selenium]
remote.server=localhost
remote.port=4444

#you can override this property from config file by providing "browser" parameter

driver.name=chromeDriver
#driver.name=edgeDriver
#driver.name=iExplorerDriver

#webdriver.remote.session=fd313470-4e25-4122-9009-5db2ae04c98d

webdriver.chrome.driver = drivers/chromedriver.exe
#system.webdriver.edge.driver=drivers/msedgedriver.exe
#system.webdriver.ie.driver=drivers/IEDriverServer.exe
#system.webdriver.gecko.driver = <GECKODRIVER_PATH>



#iExplorer.capabilities.ignoreProtectedModeSettings=true
iExplorer.additional.capabilities={"unexpectedAlertBehaviour":"ignore","ignoreProtectedModeSettings":true}
#chrome.additional.capabilities={}


#selenium.screenshot.dir=test-results/img/
#selenium.report.dir=test-results/html/

#switch capturing screenshots on/off on checkpoint success 
selenium.success.screenshots=0
selenium.failure.screenshots=1

#wd.command.listeners=
#we.command.listeners=
#teststep.listeners=

retry.count=0

#check/set below value appropriately to set retry timeout on driver initialization failure
driver.init.retry.timeout=3000

#set true to fill bean randomly from set of testdata
#bean.populate.random=false

#set 1 to suppress success log, when 0 it will also show verification success message
report.log.skip.success=0

#To define driver instance scope.Possible value can be Tests or Methods or Groups.
selenium.singletone=Methods
#selenium.singletone=Groups
#selenium.singletone=Tests

global.datadriven.parallel=false
